<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040a0d" />
      <stop offset="100%" stop-color="#091417" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 217, 245, 0.05)" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="800" height="540" fill="url(#bgGrad)" />
  <rect width="800" height="540" fill="url(#grid)" />
  <rect x="16" y="16" width="768" height="508" rx="8" fill="none" stroke="rgba(0, 217, 245, 0.2)" stroke-width="1.5" />

  <!-- Header Banner -->
  <rect x="36" y="36" width="728" height="64" rx="6" fill="rgba(0, 217, 245, 0.06)" stroke="rgba(0, 217, 245, 0.25)" stroke-width="1" />
  <text x="56" y="62" font-family="'JetBrains Mono', monospace" font-size="12" fill="#00D9F5" letter-spacing="2">SECURITY CLUB DBIT // CYBER AWARENESS // 2026-27</text>
  <text x="56" y="86" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="20" fill="#F2F7F8">PASSWORD ENTROPY &amp; MULTI-FACTOR AUTHENTICATION</text>
  <circle cx="730" cy="68" r="6" fill="#00D9F5" />

  <!-- Left: Passphrase vs Complex Short Password -->
  <g transform="translate(60, 130)">
    <rect width="320" height="340" rx="8" fill="#091417" stroke="rgba(0, 217, 245, 0.25)" stroke-width="1" />
    <text x="24" y="36" font-family="'JetBrains Mono', monospace" font-size="12" fill="#00F5A0" letter-spacing="1">PASSPHRASE FORMULA</text>
    
    <rect x="20" y="56" width="280" height="60" rx="4" fill="rgba(255, 60, 60, 0.08)" stroke="rgba(255, 60, 60, 0.3)" stroke-width="1" />
    <text x="32" y="78" font-family="'JetBrains Mono', monospace" font-size="10" fill="#ff6b6b">WEAK &amp; HARD TO REMEMBER:</text>
    <text x="32" y="100" font-family="'JetBrains Mono', monospace" font-size="14" fill="#fff" font-weight="bold">Tr0ub4dor&amp;3 (Crack: 3 days)</text>

    <rect x="20" y="132" width="280" height="72" rx="4" fill="rgba(0, 245, 160, 0.08)" stroke="rgba(0, 245, 160, 0.3)" stroke-width="1" />
    <text x="32" y="154" font-family="'JetBrains Mono', monospace" font-size="10" fill="#00F5A0">RECOMMENDED PASSPHRASE (4 WORDS):</text>
    <text x="32" y="174" font-family="'JetBrains Mono', monospace" font-size="13" fill="#fff" font-weight="bold">correct-horse-battery-staple</text>
    <text x="32" y="192" font-family="'JetBrains Mono', monospace" font-size="10" fill="#00D9F5">Crack time: ~550 Billion Years</text>

    <!-- Key Lock Graphic -->
    <circle cx="160" cy="255" r="28" fill="rgba(0, 217, 245, 0.1)" stroke="#00D9F5" stroke-width="2" />
    <path d="M 152 245 L 152 238 C 152 233, 168 233, 168 238 L 168 245" fill="none" stroke="#00D9F5" stroke-width="2.5" />
    <circle cx="160" cy="253" r="3" fill="#00F5A0" />
    <line x1="160" y1="256" x2="160" y2="265" stroke="#00F5A0" stroke-width="2.5" />

    <text x="160" y="315" font-family="'Inter', sans-serif" font-size="12" fill="#9AAEB5" text-anchor="middle">
      Length &gt; Complexity. Combine 4 random words.
    </text>
  </g>

  <!-- Right: MFA Tiers -->
  <g transform="translate(410, 130)">
    <rect width="330" height="340" rx="8" fill="#091417" stroke="rgba(0, 217, 245, 0.25)" stroke-width="1" />
    <text x="24" y="36" font-family="'JetBrains Mono', monospace" font-size="12" fill="#00D9F5" letter-spacing="1">MFA SECURITY HIERARCHY</text>
    
    <!-- Tier 1 -->
    <rect x="20" y="56" width="290" height="66" rx="4" fill="rgba(0, 245, 160, 0.08)" stroke="rgba(0, 245, 160, 0.35)" stroke-width="1" />
    <text x="32" y="76" font-family="'Space Grotesk', sans-serif" font-size="13" fill="#00F5A0" font-weight="700">★ GOLD TIER: Hardware Keys &amp; Passkeys</text>
    <text x="32" y="96" font-family="'Inter', sans-serif" font-size="11" fill="#F2F7F8">FIDO2 / WebAuthn, YubiKey, Apple/Google Passkeys.</text>
    <text x="32" y="112" font-family="'JetBrains Mono', monospace" font-size="10" fill="#00D9F5">100% immune to real-time phishing relays.</text>

    <!-- Tier 2 -->
    <rect x="20" y="134" width="290" height="66" rx="4" fill="rgba(0, 217, 245, 0.06)" stroke="rgba(0, 217, 245, 0.25)" stroke-width="1" />
    <text x="32" y="154" font-family="'Space Grotesk', sans-serif" font-size="13" fill="#00D9F5" font-weight="700">◆ SILVER TIER: Authenticator Apps (TOTP)</text>
    <text x="32" y="174" font-family="'Inter', sans-serif" font-size="11" fill="#F2F7F8">Google Authenticator, Aegis, Bitwarden, Microsoft Auth.</text>
    <text x="32" y="190" font-family="'JetBrains Mono', monospace" font-size="10" fill="#9AAEB5">Codes cycle every 30 seconds offline.</text>

    <!-- Tier 3 -->
    <rect x="20" y="212" width="290" height="66" rx="4" fill="rgba(255, 184, 0, 0.06)" stroke="rgba(255, 184, 0, 0.25)" stroke-width="1" />
    <text x="32" y="232" font-family="'Space Grotesk', sans-serif" font-size="13" fill="#FFB800" font-weight="700">▲ BRONZE TIER: SMS / Email OTPs</text>
    <text x="32" y="252" font-family="'Inter', sans-serif" font-size="11" fill="#F2F7F8">Better than nothing, but vulnerable to SIM swaps.</text>
    <text x="32" y="268" font-family="'JetBrains Mono', monospace" font-size="10" fill="#9AAEB5">Upgrade to app-based TOTP whenever available.</text>
  </g>

  <!-- Footer Tag -->
  <text x="400" y="505" font-family="'JetBrains Mono', monospace" font-size="11" fill="#9AAEB5" text-anchor="middle">STAY CONNECTED, STAY SECURE · SECURITY CLUB DBIT</text>
</svg>
