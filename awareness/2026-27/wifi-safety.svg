<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040a0d" />
      <stop offset="100%" stop-color="#091417" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 217, 245, 0.05)" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="800" height="540" fill="url(#bgGrad)" />
  <rect width="800" height="540" fill="url(#grid)" />
  <rect x="16" y="16" width="768" height="508" rx="8" fill="none" stroke="rgba(0, 217, 245, 0.2)" stroke-width="1.5" />

  <!-- Header Banner -->
  <rect x="36" y="36" width="728" height="64" rx="6" fill="rgba(0, 245, 160, 0.06)" stroke="rgba(0, 245, 160, 0.25)" stroke-width="1" />
  <text x="56" y="62" font-family="'JetBrains Mono', monospace" font-size="12" fill="#00F5A0" letter-spacing="2">SECURITY CLUB DBIT // CYBER AWARENESS // 2026-27</text>
  <text x="56" y="86" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="20" fill="#F2F7F8">CAMPUS &amp; PUBLIC WI-FI DEFENSE GUIDE</text>
  <circle cx="730" cy="68" r="6" fill="#00F5A0" />

  <!-- Left: Wi-Fi Risk Diagram -->
  <g transform="translate(60, 130)">
    <rect width="320" height="340" rx="8" fill="#091417" stroke="rgba(0, 217, 245, 0.25)" stroke-width="1" />
    <text x="24" y="36" font-family="'JetBrains Mono', monospace" font-size="12" fill="#00D9F5" letter-spacing="1">ROGUE AP &amp; MITM THREATS</text>
    
    <!-- Wi-Fi Waves Icon -->
    <g transform="translate(160, 120)">
      <path d="M -60 -40 A 70 70 0 0 1 60 -40" fill="none" stroke="#ff6b6b" stroke-width="3" stroke-linecap="round" />
      <path d="M -40 -20 A 45 45 0 0 1 40 -20" fill="none" stroke="#FFB800" stroke-width="3" stroke-linecap="round" />
      <path d="M -20 0 A 22 22 0 0 1 20 0" fill="none" stroke="#00F5A0" stroke-width="3" stroke-linecap="round" />
      <circle cx="0" cy="18" r="6" fill="#00D9F5" />
    </g>

    <rect x="20" y="160" width="280" height="65" rx="4" fill="rgba(255, 60, 60, 0.08)" stroke="rgba(255, 60, 60, 0.3)" stroke-width="1" />
    <text x="32" y="180" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#ff6b6b" font-weight="bold">Evil Twin / Rogue Hotspots</text>
    <text x="32" y="200" font-family="'Inter', sans-serif" font-size="11" fill="#F2F7F8">Attackers broadcast "DBIT_Free_WiFi" to</text>
    <text x="32" y="216" font-family="'Inter', sans-serif" font-size="11" fill="#9AAEB5">sniff unencrypted packets and redirect DNS.</text>

    <rect x="20" y="240" width="280" height="65" rx="4" fill="rgba(0, 245, 160, 0.08)" stroke="rgba(0, 245, 160, 0.3)" stroke-width="1" />
    <text x="32" y="260" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#00F5A0" font-weight="bold">Encrypted VPN Shield</text>
    <text x="32" y="280" font-family="'Inter', sans-serif" font-size="11" fill="#F2F7F8">Use trusted WireGuard / OpenVPN tunnels</text>
    <text x="32" y="296" font-family="'Inter', sans-serif" font-size="11" fill="#9AAEB5">to encrypt traffic end-to-end on public APs.</text>
  </g>

  <!-- Right: 4 Golden Rules -->
  <g transform="translate(410, 130)">
    <rect width="330" height="340" rx="8" fill="#091417" stroke="rgba(0, 217, 245, 0.25)" stroke-width="1" />
    <text x="24" y="36" font-family="'JetBrains Mono', monospace" font-size="12" fill="#00F5A0" letter-spacing="1">FOUR ENDPOINT SAFEGUARDS</text>
    
    <rect x="20" y="56" width="290" height="56" rx="4" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(0, 217, 245, 0.12)" stroke-width="1" />
    <text x="32" y="76" font-family="'Space Grotesk', sans-serif" font-size="13" fill="#F2F7F8" font-weight="600">1. Disable "Auto-Connect to Open Wi-Fi"</text>
    <text x="32" y="96" font-family="'Inter', sans-serif" font-size="11" fill="#9AAEB5">Prevents your phone from silently connecting to clones.</text>

    <rect x="20" y="122" width="290" height="56" rx="4" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(0, 217, 245, 0.12)" stroke-width="1" />
    <text x="32" y="142" font-family="'Space Grotesk', sans-serif" font-size="13" fill="#F2F7F8" font-weight="600">2. Verify HTTPS &amp; Certificate Warnings</text>
    <text x="32" y="162" font-family="'Inter', sans-serif" font-size="11" fill="#9AAEB5">Never bypass SSL alerts or install untrusted root certs.</text>

    <rect x="20" y="188" width="290" height="56" rx="4" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(0, 217, 245, 0.12)" stroke-width="1" />
    <text x="32" y="208" font-family="'Space Grotesk', sans-serif" font-size="13" fill="#F2F7F8" font-weight="600">3. Turn Off File Sharing / AirDrop</text>
    <text x="32" y="228" font-family="'Inter', sans-serif" font-size="11" fill="#9AAEB5">Set Network Profile to "Public" on Windows &amp; Mac.</text>

    <rect x="20" y="254" width="290" height="56" rx="4" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(0, 217, 245, 0.12)" stroke-width="1" />
    <text x="32" y="274" font-family="'Space Grotesk', sans-serif" font-size="13" fill="#F2F7F8" font-weight="600">4. Keep OS &amp; Browser Patched</text>
    <text x="32" y="294" font-family="'Inter', sans-serif" font-size="11" fill="#9AAEB5">Patches close zero-day remote execution vulnerabilities.</text>
  </g>

  <!-- Footer Tag -->
  <text x="400" y="505" font-family="'JetBrains Mono', monospace" font-size="11" fill="#9AAEB5" text-anchor="middle">STAY CONNECTED, STAY SECURE · SECURITY CLUB DBIT</text>
</svg>
