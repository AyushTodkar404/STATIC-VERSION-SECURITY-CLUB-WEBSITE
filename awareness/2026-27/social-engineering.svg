<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040a0d" />
      <stop offset="100%" stop-color="#091417" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 217, 245, 0.05)" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="800" height="540" fill="url(#bgGrad)" />
  <rect width="800" height="540" fill="url(#grid)" />
  <rect x="16" y="16" width="768" height="508" rx="8" fill="none" stroke="rgba(0, 217, 245, 0.2)" stroke-width="1.5" />

  <!-- Header Banner -->
  <rect x="36" y="36" width="728" height="64" rx="6" fill="rgba(0, 217, 245, 0.06)" stroke="rgba(0, 217, 245, 0.25)" stroke-width="1" />
  <text x="56" y="62" font-family="'JetBrains Mono', monospace" font-size="12" fill="#00D9F5" letter-spacing="2">SECURITY CLUB DBIT // CYBER AWARENESS // 2026-27</text>
  <text x="56" y="86" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="20" fill="#F2F7F8">SOCIAL ENGINEERING &amp; OSINT FOOTPRINT</text>
  <circle cx="730" cy="68" r="6" fill="#00D9F5" />

  <!-- Left: OSINT Digital Footprint -->
  <g transform="translate(60, 130)">
    <rect width="320" height="340" rx="8" fill="#091417" stroke="rgba(0, 217, 245, 0.25)" stroke-width="1" />
    <text x="24" y="36" font-family="'JetBrains Mono', monospace" font-size="12" fill="#00F5A0" letter-spacing="1">YOUR DIGITAL FOOTPRINT</text>
    
    <!-- Radar Node Map -->
    <g transform="translate(160, 130)">
      <circle cx="0" cy="0" r="50" fill="none" stroke="rgba(0, 217, 245, 0.15)" stroke-width="1" />
      <circle cx="0" cy="0" r="30" fill="none" stroke="rgba(0, 245, 160, 0.2)" stroke-width="1" />
      <circle cx="0" cy="0" r="8" fill="#00D9F5" />
      <circle cx="-35" cy="-25" r="4" fill="#00F5A0" />
      <circle cx="40" cy="-20" r="4" fill="#ff6b6b" />
      <circle cx="25" cy="35" r="4" fill="#00F5A0" />
      <circle cx="-30" cy="30" r="4" fill="#00D9F5" />
      <line x1="0" y1="0" x2="-35" y2="-25" stroke="rgba(0, 217, 245, 0.3)" stroke-width="1" />
      <line x1="0" y1="0" x2="40" y2="-20" stroke="rgba(255, 107, 107, 0.4)" stroke-width="1" />
      <line x1="0" y1="0" x2="25" y2="35" stroke="rgba(0, 245, 160, 0.3)" stroke-width="1" />
      <line x1="0" y1="0" x2="-30" y2="30" stroke="rgba(0, 217, 245, 0.3)" stroke-width="1" />
    </g>

    <rect x="20" y="210" width="280" height="95" rx="4" fill="rgba(0, 217, 245, 0.05)" stroke="rgba(0, 217, 245, 0.2)" stroke-width="1" />
    <text x="32" y="230" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#00D9F5" font-weight="bold">Public Oversharing Hazards</text>
    <text x="32" y="250" font-family="'Inter', sans-serif" font-size="11" fill="#F2F7F8">Posting exam hall tickets, college IDs,</text>
    <text x="32" y="266" font-family="'Inter', sans-serif" font-size="11" fill="#9AAEB5">or birthday details gives attackers answers</text>
    <text x="32" y="282" font-family="'Inter', sans-serif" font-size="11" fill="#9AAEB5">to your security reset questions.</text>
  </g>

  <!-- Right: Common Attack Vectors -->
  <g transform="translate(410, 130)">
    <rect width="330" height="340" rx="8" fill="#091417" stroke="rgba(0, 217, 245, 0.25)" stroke-width="1" />
    <text x="24" y="36" font-family="'JetBrains Mono', monospace" font-size="12" fill="#00D9F5" letter-spacing="1">COMMON SOCIAL ATTACK VECTORS</text>
    
    <rect x="20" y="56" width="290" height="66" rx="4" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(0, 217, 245, 0.12)" stroke-width="1" />
    <text x="32" y="76" font-family="'Space Grotesk', sans-serif" font-size="13" fill="#00F5A0" font-weight="600">Pretexting &amp; Impersonation</text>
    <text x="32" y="96" font-family="'Inter', sans-serif" font-size="11" fill="#F2F7F8">Attackers pose as college administrators,</text>
    <text x="32" y="112" font-family="'Inter', sans-serif" font-size="11" fill="#9AAEB5">faculty, or internship recruiters demanding data.</text>

    <rect x="20" y="134" width="290" height="66" rx="4" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(0, 217, 245, 0.12)" stroke-width="1" />
    <text x="32" y="154" font-family="'Space Grotesk', sans-serif" font-size="13" fill="#00D9F5" font-weight="600">Baiting (USB &amp; Free Software)</text>
    <text x="32" y="174" font-family="'Inter', sans-serif" font-size="11" fill="#F2F7F8">Leaving rogue flash drives around labs or offering</text>
    <text x="32" y="190" font-family="'Inter', sans-serif" font-size="11" fill="#9AAEB5">'cracked' software bundled with backdoors.</text>

    <rect x="20" y="212" width="290" height="66" rx="4" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(0, 217, 245, 0.12)" stroke-width="1" />
    <text x="32" y="232" font-family="'Space Grotesk', sans-serif" font-size="13" fill="#FFB800" font-weight="600">Tailgating into Secure Labs</text>
    <text x="32" y="252" font-family="'Inter', sans-serif" font-size="11" fill="#F2F7F8">Following authorized students through locked</text>
    <text x="32" y="268" font-family="'Inter', sans-serif" font-size="11" fill="#9AAEB5">server rooms or department lab doors.</text>
  </g>

  <!-- Footer Tag -->
  <text x="400" y="505" font-family="'JetBrains Mono', monospace" font-size="11" fill="#9AAEB5" text-anchor="middle">STAY CONNECTED, STAY SECURE · SECURITY CLUB DBIT</text>
</svg>
